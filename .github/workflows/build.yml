name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            icon: icon.ico
            sep: ";"
          - os: macos-latest
            icon: icon.icns
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyinstaller
      - run: python -c "from rapidocr import RapidOCR; RapidOCR()"
      - run: python make_icon.py
      - run: pyinstaller --noconfirm --windowed --name DocGuard --icon ${{ matrix.icon }} --add-data "icon.png${{ matrix.sep }}." --collect-all tkinterdnd2 --collect-all rapidocr --collect-all onnxruntime docguard.py
      - uses: actions/upload-artifact@v4
        with:
          name: DocGuard-${{ runner.os }}
          path: dist/
